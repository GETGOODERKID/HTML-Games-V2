<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Dogeminer 2 (Fixed Build)</title>

<!-- FIX: makes all /play and /img paths work on GitHub Pages -->
<base href="./">

<link rel="icon" href="./favicon.ico">

<style>
  body {
    margin: 0;
    background: #363636;
    overflow: hidden;
  }

  #loading-indicator {
    position: absolute;
    width: 100%;
    top: 40%;
    text-align: center;
    color: white;
    font-family: Arial, sans-serif;
  }

  #game {
    width: 100vw;
    height: 100vh;
  }
</style>
</head>

<body>

<div id="loading-indicator">
  <p id="loading-text">Loading Dogeminer...</p>
</div>

<div id="game"></div>

<script>
/* -----------------------------
   SAFE LOADING SYSTEM
   (no redirects, no bot traps)
------------------------------*/

window.loadingblink = true;

const messages = [
  "Loading...",
  "Preparing game...",
  "Spawning Doge...",
  "Mining dogecoins...",
  "Almost ready..."
];

let i = 0;
const loader = document.getElementById("loading-text");

const interval = setInterval(() => {
  if (!loader) return;

  loader.innerHTML = messages[i % messages.length];
  i++;
}, 1200);

window.addEventListener("load", () => {
  clearInterval(interval);

  setTimeout(() => {
    const el = document.getElementById("loading-indicator");
    if (el) el.style.display = "none";
  }, 1500);
});
</script>

<!-- GAME ENGINE (YOUR ORIGINAL FILE) -->
<script src="./play.b65807b2dcf795a26844.js"></script>

</body>
</html>
