<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Idle Breakout</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <style>
    /* Remove all spacing and make page fullscreen */
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    /* Center the game and fill screen */
    #gm4html5 {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* Make canvas fullscreen */
    canvas {
      width: 100vw;
      height: 100vh;
      display: block;

      image-rendering: pixelated;
      image-rendering: crisp-edges;

      margin: 0;
      padding: 0;
      border: 0;
    }

    /* Fullscreen support */
    :fullscreen canvas {
      width: 100%;
      height: 100%;
    }

    :-webkit-full-screen canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="gm4html5">
    <canvas id="canvas" width="1024" height="768">
      <p>Your browser doesn't support HTML5 canvas.</p>
    </canvas>
  </div>

  <!-- Main script -->
  <script src="/js/main.js"></script>

  <!-- Game code -->
  <script src="html5game/Coding_BreakOut1.js"></script>

  <script>
    window.onload = function () {
      GameMaker_Init();

      // Optional: auto fullscreen on click
      document.body.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      });
    };
  </script>
</body>
</html>
